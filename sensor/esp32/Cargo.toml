[package]
edition      = "2024"
name         = "plant-sensor"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "plant-sensor"
path = "./src/bin/main.rs"

[dependencies]
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-hal = { version = "~1.1.0", features = ["esp32", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32", "log-04"] }
critical-section = "1.2.0"
esp-alloc = "0.10.0"
log = "0.4.27"
nb = "1.1.0"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
